<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="{{ site.author }}" />
    <title>{% if page.path == 'index.html' %}{{ site.name }}{% else %}{% unless page.id %}{{ site.name }} - {% endunless %}{{ page.title }}{% endif %}</title>
    <link rel="canonical" href="{{ site.url }}{{ page.url }}" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link href="/feed.xml" rel="alternate" title="{{ site.name }}" type="application/atom+xml" />
    <link rel="stylesheet" href="/media/css/style.css" />
    <link rel="stylesheet" href="/media/css/highlight.css" media="all"/>
    {% if site.google_analytics %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ site.google_analytics }}');
    </script>
    {% endif %}
  </head>
  <body>
    <div id="container">
      <div id="main" role="main">
        {% unless page.path == 'index.html' %}
        <header>
          <h1>{{ page.title }}</h1>
        </header>
        {% endunless %}
        <nav>
          <span><a title="首页" class="" href="/">首页</a></span>
          <span><a title="分类" class="" href="/categories/">分类</a></span>
          <span><a title="标签" class="" href="/tags/">标签</a></span>
          <span><a title="留言" class="" href="/guestbook/">留言</a></span>
          <span><a title="关于" class="" href="/about/">关于</a></span>
        </nav>
        <article class="content">
          {{ content }}
        </article>
      </div>

      <footer>
        <p><small>
            <a rel="license" href="https://creativecommons.org/licenses/by-sa/3.0/cn/" target="_blank" title="许可协议">©</a> 2006 - {{site.time | date:"%Y"}} <a href="/">{{ site.sitedomain }}</a>
        </small></p>
      </footer>

    </div>
  </body>
</html>
